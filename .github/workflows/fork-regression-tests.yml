name: Fork Regression Tests

permissions:
  contents: read

on:
  push:
    paths:
      - ".github/workflows/**"
      - "pasarguard.sh"
      - "pg-node.sh"
      - "pg-node-service.sh"
      - "install_core.sh"
      - "lib/**"
      - "iran-sanction/**"
      - "tools/**"
      - "tests/**"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "pasarguard.sh"
      - "pg-node.sh"
      - "pg-node-service.sh"
      - "install_core.sh"
      - "lib/**"
      - "iran-sanction/**"
      - "tools/**"
      - "tests/**"
  workflow_dispatch:

jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync zip unzip

      - name: Backup archives the dump it just took
        run: bash tests/run_isolated.sh tests/test_fresh_dump_in_archive.sh

      - name: A failed restore restarts the panel and keeps its log
        run: bash tests/run_isolated.sh tests/test_restore_failure_restarts_panel.sh

      - name: Scripts report their commit honestly and fetch the fork
        run: bash tests/run_isolated.sh tests/test_fork_script_repo.sh

      - name: node-serviced is installed only when it matches the release checksum
        run: bash tests/run_isolated.sh tests/test_node_serviced_checksum.sh

      - name: Services running the fork's panel image are panel services
        run: bash tests/run_isolated.sh tests/test_fork_panel_image_detection.sh

      - name: Every Compose call loads the override that Compose itself would load
        run: bash tests/run_isolated.sh tests/test_compose_override_honoured.sh

      - name: A restore keeps the destination's Compose override and never installs the archive's
        run: bash tests/run_isolated.sh tests/test_restore_keeps_destination_override.sh

      - name: The panel's database user is a PgBouncer stats user, never an admin
        run: bash tests/run_isolated.sh tests/test_pgbouncer_console_read_only.sh

      - name: The node-serviced unit is written with mode 644
        run: bash tests/run_isolated.sh tests/test_node_service_unit_mode.sh

      - name: No node-serviced update lock on nodes without node-serviced
        run: bash tests/run_isolated.sh tests/test_node_service_lock_only_when_installed.sh

      - name: Standalone bundles report the commit they were built from
        run: bash tests/run_isolated.sh tests/test_standalone_commit_bake.sh

      - name: node-serviced rollbacks keep concurrent .env edits
        run: bash tests/run_isolated.sh tests/test_node_service_env_interleaving.sh

      - name: Every .env write in pg-node.sh holds the .env lock
        run: bash tests/run_isolated.sh tests/test_env_writes_hold_lock.sh

      - name: node_env_write refuses to change .env without the lock
        run: bash tests/run_isolated.sh tests/test_node_env_write_requires_lock.sh

      - name: Fork workflows pin their actions and drop the job token
        run: bash tests/run_isolated.sh tests/test_fork_workflow_hardening.sh

      - name: The test harness fails a test that leaves temporary files
        run: bash tests/run_isolated.sh tests/test_run_isolated.sh
